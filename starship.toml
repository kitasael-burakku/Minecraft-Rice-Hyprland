# Kitasan Glass Universal

format = """
$status\
${custom.fade_start}\
${custom.user_pretty}\
${custom.hostname_pretty}\
$directory\
$fill\
$git_branch\
$git_status\
$python\
$nodejs\
$rust\
$golang\
${custom.fade_end}\
$line_break\
$cmd_duration\
$character\
"""

command_timeout = 500

[fill]
symbol = " "

# ── Bloques de Desvanecimiento Inicial (Fade) ───────────────────
[custom.fade_start]
command = "echo"
when = "true"
format = "[█](fg:#5a5a5a)[█](fg:#607888)[█](fg:#8098a8)"

# ── Contenedores de Usuario y Host (Encapsulados en el bloque) ──
[custom.user_pretty]
command = "echo $USER_PRETTY"
when = "test -n \"$USER_PRETTY\""
style = "bg:#8098a8 fg:#f0f0f0 bold"
format = "[ $output ]($style)"

[custom.hostname_pretty]
command = "hostnamectl --pretty"
when = "test -n \"$(hostnamectl --pretty)\""
style = "bg:#8098a8 fg:#f0f0f0 bold"
format = "[󰍹 $output ]($style)"

# ── Directorio (Continuación perfecta del bloque de color) ──────
[directory]
style = "bg:#8098a8 fg:#f0f0f0 bold"
format = "[ $path]($style)[ ](fg:#8098a8 bg:bold)" 
home_symbol = " ホーム"
read_only = "  読取専用"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Desktop" = " デスクトップ"
"Documents" = " ドキュメント"
"Downloads" = " ダウンロード"
"Music" = "󰎈 音楽"
"Pictures" = " 写真"
"Videos" = " ビデオ"
"Projects" = "󱌢 プロジェクト"
"GitHub" = "󰊤 ギットハブ"
"Code" = " コード"
".config" = " 設定"

# ── Lado Derecho: Git y Lenguajes (Encapsulados en Gris Oscuro) ─
[git_branch]
symbol = ""
style = "bg:#2e3238 fg:#d8d8d8 bold"
truncation_length = 18
format = "[ ](fg:#2e3238)[ $symbol $branch]($style)"

[git_status]
style = "bg:#2e3238 fg:#b85c50 bold"
format = "[$all_status$ahead_behind ]($style)"
conflicted = "󰞇 "
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕"
untracked = ""
stashed = "󰆼"
modified = ""
staged = ""
renamed = ""
deleted = ""

# ── Lenguajes de Programación (Comparten el bloque derecho) ─────
[python]
symbol = ""
style = "bg:#2e3238 fg:#c8b898 bold"
format = "[$symbol$version ]($style)"

[nodejs]
symbol = ""
style = "bg:#2e3238 fg:#b0d0d8 bold"
format = "[$symbol$version ]($style)"

[rust]
symbol = ""
style = "bg:#2e3238 fg:#d8c098 bold"
format = "[$symbol$version ]($style)"

[golang]
symbol = ""
style = "bg:#2e3238 fg:#c8b898 bold"
format = "[$symbol$version ]($style)"

# Cierre sutil para el bloque de la derecha
[custom.fade_end]
command = "echo"
when = "true"
format = "[](fg:#2e3238)"

# ── Duración del Comando (Línea Inferior) ──────────────────────
[cmd_duration]
min_time = 2000
show_milliseconds = false
style = "fg:#5a5a5a italic"
format = "[└ 󰔚 $duration]($style) "

# ── Prompt Character ───────────────────────────────────────────
[character]
success_symbol = "[❯](fg:#e8e8e8)"
error_symbol =   "[❯](fg:#b85c50)"

# ── Status (Errores) ───────────────────────────────────────────
[status]
disabled = false
style = "fg:#b85c50 bold"
format = "[󰅚 $status ]($style)"

# ── Módulos Deshabilitados ─────────────────────────────────────
[package]
disabled = true
[memory_usage]
disabled = true
[time]
disabled = true
[line_break]
disabled = false