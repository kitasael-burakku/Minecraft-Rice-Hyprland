"$schema" = 'https://starship.rs/config-schema.json'

format = """
$status\
${custom.user_pretty}\
${custom.hostname_pretty}\
$os\
$directory\
$fill\
$git_branch\
$git_status\
$python\
$nodejs\
$rust\
$golang\
${custom.right_cap}\
$line_break\
$cmd_duration\
$character\
"""

command_timeout = 500
add_newline = false

# ── Fill ────────────────────────────────────────────────────────
[fill]
symbol = " "

# ── Usuario ─────────────────────────────────────────────────────
[custom.user_pretty]
disabled = false
command = "echo $USER_PRETTY"
when = "test -n \"$USER_PRETTY\""
style = "bg:#2e3e4e fg:#b0d0d8 bold"
format = "[▌]($style)[$output]($style)"

# ── Hostname ────────────────────────────────────────────────────
[custom.hostname_pretty]
command = "hostnamectl --pretty 2>/dev/null || hostname"
when = "true"
style = "bg:#1e2e38 fg:#8098a8"
format = "[ 󰍹 $output]($style)"

# ── OS ──────────────────────────────────────────────────────────
[os]
disabled = true
style = "bg:#1a2430 fg:#7ab8b8"
format = "[ $symbol ]($style)"

[os.symbols]
Arch        = "󰣇"
CachyOS     = "󰣇"
Manjaro     = ""
Fedora      = ""
Ubuntu      = ""
Debian      = ""
NixOS       = ""
EndeavourOS = ""
Garuda      = "󰛓"
openSUSE    = ""
Gentoo      = "󰣨"
Alpine      = ""
Unknown     = "󰌽"

# ── Directorio ──────────────────────────────────────────────────
[directory]
style = "bg:#2e3238 fg:#c8b898 bold"
format = "[ $path]($style)[▌](fg:#2e3238)"
home_symbol = "󱂵 ホーム"
read_only = " 読取専用"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Desktop"   = "󰇄 デスクトップ"
"Documents" = "󰈙 ドキュメント"
"Downloads" = "󰇚 ダウンロード"
"Music"     = "󰎈 音楽"
"Pictures"  = "󰏏 写真"
"Videos"    = "󰕧 ビデオ"
"Projects"  = "󱌢 プロジェクト"
"GitHub"    = "󰊤 ギットハブ"
"Code"      = "󰨞 コード"
".config"   = "󰒓 設定"

# ── Git branch ──────────────────────────────────────────────────
[git_branch]
symbol = "󰊢"
style = "bg:#2e3238 fg:#d8d8d8 bold"
truncation_length = 18
format = "[▌](fg:#2e3238)[ $symbol $branch ]($style)"

# ── Git status ──────────────────────────────────────────────────
[git_status]
style = "bg:#2e3238 fg:#b85c50 bold"
format = "[$all_status$ahead_behind ]($style)"
conflicted = "󰞇 "
ahead      = "⇡${count}"
behind     = "⇣${count}"
diverged   = "⇕"
untracked  = "󰋗 "
stashed    = "󰆼"
modified   = "󰏫 "
staged     = "󰐗 "
renamed    = "󰕚 "
deleted    = "󰍶 "

# ── Lenguajes ───────────────────────────────────────────────────
[python]
symbol = ""
style = "bg:#2e3238 fg:#c8b898 bold"
format = "[$symbol $version ]($style)"

[nodejs]
symbol = ""
style = "bg:#2e3238 fg:#b0d0d8 bold"
format = "[$symbol $version ]($style)"

[rust]
symbol = ""
style = "bg:#2e3238 fg:#d8c098 bold"
format = "[$symbol $version ]($style)"

[golang]
symbol = ""
style = "bg:#2e3238 fg:#9ab0a0 bold"
format = "[$symbol $version ]($style)"

# ── Cierre bloque derecho ────────────────────────────────────────
[custom.right_cap]
command = "echo"
when = "true"
format = "[▌](fg:#2e3238 bg:none)"

# ── Duración del comando ─────────────────────────────────────────
[cmd_duration]
min_time = 2000
show_milliseconds = false
style = "fg:#5a5248 italic"
format = "[ 󰔚 $duration ]($style)"

# ── Prompt character ─────────────────────────────────────────────
[character]
success_symbol = "[ -->](fg:#7ab8b8 bold)"
error_symbol   = "[ x](fg:#b85c50 bold)"

# ── Status (solo cuando hay error) ──────────────────────────────
[status]
disabled = false
style = "fg:#b85c50 bold"
format = "[󰅚 $status]($style)"

# ── Módulos deshabilitados ───────────────────────────────────────
[package]
disabled = true

[memory_usage]
disabled = true

[time]
disabled = true

[line_break]
disabled = false