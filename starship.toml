format = """$cmd_duration${custom.user_pretty}${custom.hostname_pretty}$directory$git_branch$git_status$python$nodejs$rust$golang$status$line_break      $character"""

[username]
disabled = true

[hostname]
disabled = true

[custom.user_pretty]
command = "echo $USER_PRETTY"
when = "test -n \"$USER_PRETTY\""
style = "bg:#3a3a3a fg:#e2e2e2 bold"
format = "[](fg:#3a3a3a)[$output]($style)[](fg:#3a3a3a) "

[custom.hostname_pretty]
command = "hostnamectl --pretty"
when = "test -n \"$(hostnamectl --pretty)\""
style = "bg:#3a3a3a fg:#e2e2e2 bold"
format = "[](fg:#3a3a3a)[$output]($style)[](fg:#3a3a3a) "

[directory]
home_symbol = " ホーム"
read_only = " 読取専用"
style = "bg:#2a3a44 fg:#c0c8cc bold"
format = "[](fg:#2a3a44)[ 󰉋 → $path ]($style)[](fg:#2a3a44) "
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Desktop" = " デスクトップ"
"Documents" = " ドキュメント"
"Downloads" = " ダウンロード"
"Music" = "󰎈 音楽"
"Pictures" = " 写真"
"Videos" = " ビデオ"
"Projects" = "󱌢 プロジェクト"
"GitHub" = "󰊤 ギットハブ"
"Code" = " コード"
".config" = " 設定"

[git_branch]
symbol = "~"
style = "bg:#484848 fg:#d0d0d0 bold"
truncation_length = 18
truncation_symbol = ""
format = "[](fg:#484848)[ $symbol $branch ]($style)[](fg:#484848) "

[git_status]
style = "bg:#484848 fg:#a85a48 bold"
conflicted = "🏳"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕"
untracked = "?${count}"
stashed = "󰆼"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"
format = "[](fg:#484848)[$all_status$ahead_behind]($style)[](fg:#484848) "

[python]
symbol = ""
style = "bg:#2a3a44 fg:#c0c8cc bold"
format = "[](fg:#2a3a44)[ $symbol $version ]($style)[](fg:#2a3a44) "

[nodejs]
symbol = ""
style = "bg:#2a3a44 fg:#c0c8cc bold"
format = "[](fg:#2a3a44)[ $symbol $version ]($style)[](fg:#2a3a44) "

[rust]
symbol = ""
style = "bg:#3a3028 fg:#c0a880 bold"
format = "[](fg:#3a3028)[ $symbol $version ]($style)[](fg:#3a3028) "

[golang]
symbol = ""
style = "bg:#2a3a44 fg:#c0c8cc bold"
format = "[](fg:#2a3a44)[ $symbol $version ]($style)[](fg:#2a3a44) "

[cmd_duration]
min_time = 2000
show_milliseconds = false
style = "bg:#242424 fg:#b0b0b0 italic"
format = "[](fg:#242424)[ 󰪢 $duration ]($style)[](fg:#242424) "

[character]
success_symbol = "[ ](fg:#909090)"
error_symbol = "[ ](fg:#a85a48)"

[status]
disabled = false
format = "[](fg:#484848)[✘ エラー $status](bg:#484848 fg:#a85a48 bold)[](fg:#484848) "

[package]
disabled = true

[line_break]
disabled = false

[memory_usage]
disabled = true

[time]
disabled = true
