"$schema" = 'https://starship.rs/config-schema.json'
# Generado por matugen — no editar a mano.
# Estático de referencia: ~/.config/starship.static.toml

# Se agregó el inicio del bloque derecho [] directamente en el formato principal
format = """
$status\
$os\
${custom.user_pretty}\
${custom.hostname_pretty}\
$directory\
$fill\
[](fg:#261e18)\
$git_branch\
$git_status\
$python\
$nodejs\
$rust\
$golang\
${custom.right_cap}\
$line_break\
$cmd_duration\
$character\
"""

command_timeout = 500
add_newline = false

# ── Fill (Relleno central limpio) ────────────────────────────────
[fill]
symbol = " "

# ── OS (Inicio del bloque izquierdo) ────────────────────────────
[os]
disabled = false
style = "bg:#221a14 fg:#ffb77a"
format = "[](fg:#221a14)[ $symbol ]($style)"

[os.symbols]
Arch        = "󰣇"
CachyOS     = "󰣇"
Manjaro     = ""
Fedora      = ""
Ubuntu      = ""
Debian      = ""
NixOS       = ""
EndeavourOS = ""
Garuda      = "󰛓"
openSUSE    = ""
Gentoo      = "󰣨"
Alpine      = ""
Unknown     = "󰌽"

# ── Usuario ─────────────────────────────────────────────────────
[custom.user_pretty]
disabled = false
command = "echo $USER_PRETTY"
when = "test -n \"$USER_PRETTY\""
style = "bg:#261e18 fg:#ffb77a bold"
format = "[](bg:#261e18 fg:#221a14)[ $output ]($style)"

# ── Hostname ────────────────────────────────────────────────────
[custom.hostname_pretty]
command = "hostnamectl --pretty 2>/dev/null || hostname"
when = "true"
style = "bg:#261e18 fg:#9e8e82"
format = "[](bg:#261e18 fg:#261e18)[ 󰍹 $output ]($style)"

# ── Directorio ──────────────────────────────────────────────────
[directory]
style = "bg:#261e18 fg:#c4cb97 bold"
format = "[](bg:#261e18 fg:#261e18)[ $path ]($style)[](fg:#261e18 bg:none) "
home_symbol = "󱂵 ホーム"
read_only = "  読取専用"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Desktop"   = "󰇄 デスクトップ"
"Documents" = "󰈙 ドキュメント"
"Downloads" = "󰇚 ダウンロード"
"Music"     = "󰎈 音楽"
"Pictures"  = "󰏏 写真"
"Videos"    = "󰕧 ビデオ"
"Projects"  = "󱌢 プロジェクト"
"GitHub"    = "󰊤 ギットハブ"
"Code"      = "󰨞 コード"
".config"   = "󰒓 設定"

# ── Git branch ──────────────────────────────────────────────────
[git_branch]
symbol = "󰊢"
style = "bg:#261e18 fg:#d6c3b6 bold"
truncation_length = 18
# Se elimina el separador manual aquí; el formato principal ya maneja la apertura
format = "[ $symbol $branch ]($style)"

# ── Git status ──────────────────────────────────────────────────
# Semántico (conflictos/cambios) — queda fijo, no sigue al wallpaper.
[git_status]
style = "bg:#261e18 fg:#b85c50 bold"
format = "[$all_status$ahead_behind ]($style)"
conflicted = "󰞇 "
ahead      = "⇡${count}"
behind     = "⇣${count}"
diverged   = "⇕"
untracked  = "󰋗 "
stashed    = "󰆼"
modified   = "󰏫 "
staged     = "󰐗 "
renamed    = "󰕚 "
deleted    = "󰍶 "

# ── Lenguajes (cada uno a un rol distinto para conservar variedad) ──────
[python]
symbol = ""
style = "bg:#261e18 fg:#e0e7b1 bold"
format = "[$symbol $version ]($style)"

[nodejs]
symbol = ""
style = "bg:#261e18 fg:#ffdcc2 bold"
format = "[$symbol $version ]($style)"

[rust]
symbol = ""
style = "bg:#261e18 fg:#e3c0a5 bold"
format = "[$symbol $version ]($style)"

[golang]
symbol = ""
style = "bg:#261e18 fg:#ffdcc2 bold"
format = "[$symbol $version ]($style)"

# ── Cierre bloque derecho ────────────────────────────────────────
[custom.right_cap]
command = "echo"
when = "true"
# Cierra el bloque de lenguajes/git con un borde redondeado simétrico
format = "[](fg:#261e18 bg:none)"

# ── Duración del comando ─────────────────────────────────────────
[cmd_duration]
min_time = 2000
show_milliseconds = false
style = "fg:#efe0d6 italic"
format = "[ 󰔚 $duration ]($style)"

# ── Prompt character ─────────────────────────────────────────────
[character]
success_symbol = "[ 󰁔](fg:#ffb77a bold)"
# Semántico (error) — queda fijo.
error_symbol   = "[ 󰁔](fg:#b85c50 bold)"

# ── Status (Error previo) ────────────────────────────────────────
# Semántico — queda fijo.
[status]
disabled = false
style = "fg:#b85c50 bold"
format = "[󰅚 $status ]($style)"

# ── Módulos deshabilitados ───────────────────────────────────────
[package]
disabled = true
[memory_usage]
disabled = true
[time]
disabled = true
[line_break]
disabled = false
