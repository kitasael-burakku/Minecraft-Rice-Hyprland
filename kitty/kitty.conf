# ---------------------------------------------------------
# KITTY CONFIGURATION
# ---------------------------------------------------------
# -- Colors -- #
include colors/colors.conf

# -- Fonts -- #
font_family                     JetBrainsMono Nerd Font
bold_font                       auto
italic_font                     auto
bold_italic_font                auto
font_size                       10
disable_ligatures               never
force_ltr                       no

# -- Background -- #
background_opacity              0.7
dynamic_background_opacity      yes
background_blur                 32
scrollbar_handle_opacity        0
scrollbar_track_opacity         0

# -- URLs -- #
url_style                       curly
url_prefixes                    http https file ftp
detect_urls                     yes
open_url_with                   default
underline_hyperlinks            always

# -- Performance -- #
sync_to_monitor                 no
repaint_delay                   8
input_delay                     1

# -- Cursor -- #
cursor_shape                    underline
cursor_underline_thickness      2
cursor_trail                    2
cursor_trail_start_threshold    0
cursor_trail_decay              0.20 0.55
cursor_blink_interval           0.5 ease-in-out
cursor_stop_blinking_after      8

# -- Terminal bell -- #
enable_audio_bell               no
window_alert_on_bell            yes
visual_bell_duration            0.15
visual_bell_color               #1a1a2e

# -- Shell & Integration -- #
shell                           fish
shell_integration               no-cursor
confirm_os_window_close         0

# -- Window Layout -- #
remember_window_size            no
initial_window_width            120c
initial_window_height           30c
window_padding_width            20
hide_window_decorations         yes
placement_strategy              center

# -- Scrollback -- #
scrollback_lines                10000

# -- Scrolling -- #
wheel_scroll_multiplier         3.0
touch_scroll_multiplier         3.0
pixel_scroll                    yes
momentum_scroll                 0.96

# -- Clipboard -- #
clipboard_control               write-clipboard read-clipboard
copy_on_select                  yes

# -- Safety / Paste -- #
paste_actions                   quote-urls-at-prompt,confirm,confirm-if-large
strip_trailing_spaces           smart

# -- Mouse behavior -- #
mouse_hide_wait                 -1.0
focus_follows_mouse             no
default_pointer_shape           beam
pointer_shape_when_grabbed      arrow
pointer_shape_when_dragging     beam crosshair

# -- Scrollback / Pager -- #
scrollback_pager                less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
scrollback_pager_history_size   20
scrollback_fill_enlarged_window yes