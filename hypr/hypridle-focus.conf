# Variante de hypr/hypridle.conf para el modo "focus" (ver
# hypr/scripts/desktop-mode.sh) — mismos comandos, timeouts más largos
# (30 min / 60 min en vez de 5 min / 10 min) para no interrumpir sesiones
# largas de trabajo concentrado. Invocada como proceso crudo
# (`hypridle -c hypridle-focus.conf &`), no vía hypridle.service — ese
# servicio se para mientras el modo focus está activo.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 1800
    on-timeout = loginctl lock-session
}

listener {
    timeout = 3600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
