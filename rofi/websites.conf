# ============================================================================
#  websites.conf — data file for the Rofi web hub (SUPER + SHIFT + /)
# ----------------------------------------------------------------------------
#  One [Category] header per section, then one "Name | URL" line per page.
#  Order in this file is the order rofi shows things in, top to bottom.
#
#  - Blank lines and lines starting with # are ignored.
#  - Everything up to the first "|" is the display name; everything after
#    is the URL (a stray "|" inside the URL itself is fine and preserved).
#  - Keep display names unique WITHIN a category — the picker looks pages
#    up by their exact label. The same name across different categories is
#    fine (e.g. "Arch Wiki" appears under both Linux and Documentation).
#  - To add a page: add a line under its category. To add a category: add
#    a new "[Name]" header. No script needs to change either way.
# ============================================================================

