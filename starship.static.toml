"$schema" = 'https://starship.rs/config-schema.json'

# ── Referencia estática de la plantilla dinámica ─────────────────
# Gemelo de ~/.config/matugen/templates/starship.toml con la paleta fija
# "Kitasan Glass". hypr/scripts/apply-static-colors.sh copia ESTE archivo
# encima de ~/.config/starship.toml al apagar matugen (SUPER+SHIFT+W), así
# que todo cambio de estructura tiene que hacerse en los DOS archivos o se
# pierde al primer toggle. hypr/scripts/check-template-parity.sh compara el
# conjunto de claves de ambos.
#
# ── Forma del prompt ────────────────────────────────────────────
#   ┌ 󰣇 キタサンブラック@ゴールドシップ  󱂵 ホーム/󰒓 設定/hypr  󰊢 main 󰏫
#   └ $
#
# Dos líneas a propósito: toda la información vive arriba y la segunda
# línea es siempre "└ $ ", de ancho constante, así lo que escribís arranca
# siempre en la misma columna sin que una ruta larga lo empuje.
#
# Sin fondos (bg:). El diseño anterior era de bloques powerline encadenados,
# que exigen que cada bloque contraste con el vecino — frágil con matugen,
# porque las paletas que saca de un wallpaper varían mucho y dos bloques
# adyacentes pueden terminar casi del mismo color. Color sólo en primer
# plano sobre el fondo del terminal es mucho más robusto ante una paleta
# impredecible.
#
# Sin $fill ni [custom.right_cap]: no hay bloque derecho que cerrar. De paso
# eso elimina los dos `sh -c` por render que costaba right_cap (9 ms).

format = """
[┌](fg:#8098a8) \
$os\
${env_var.USER_PRETTY}\
[@](fg:#8098a8)\
${env_var.HOSTNAME_PRETTY}\
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$rust\
$golang\
$cmd_duration\
$status\
$line_break\
[└](fg:#8098a8) \
$character\
"""

command_timeout = 500
add_newline = false

# ── OS ──────────────────────────────────────────────────────────
[os]
disabled = false
style = "fg:#8ab0b8"
format = "[$symbol ]($style)"

[os.symbols]
Arch        = "󰣇"
CachyOS     = "󰣇"
Manjaro     = "󱆅"
Fedora      = "󰣛"
Ubuntu      = "󰕈"
Debian      = "󰣚"
NixOS       = "󱄅"
EndeavourOS = ""
Garuda      = "󰛓"
openSUSE    = ""
Gentoo      = "󰣨"
Alpine      = ""
Unknown     = "󰌽"

# ── Usuario ─────────────────────────────────────────────────────
# env_var y no custom: un [custom.*] lanza DOS `sh -c` por render de prompt
# (uno para `when`, otro para `command`) sólo para leer una variable que
# starship ya tiene en su propio entorno. env_var la lee en proceso, sin
# forks. Se oculta sola si USER_PRETTY no está definida.
[env_var.USER_PRETTY]
style = "fg:#b0d0d8 bold"
format = "[$env_value]($style)"

# ── Hostname ────────────────────────────────────────────────────
# Antes: `hostnamectl --pretty`, que no lee un archivo sino que abre D-Bus
# contra systemd-hostnamed (activándolo si no estaba corriendo) — 59 ms
# medidos POR PROMPT sobre un dato que no cambia entre logins.
# HOSTNAME_PRETTY sale de hypr/modules/environment.lua.
# Va en el mismo tono tenue que el "@" y las guías: el par usuario@host se
# lee como una unidad, con el usuario destacado y el resto de apoyo.
[env_var.HOSTNAME_PRETTY]
style = "fg:#8098a8"
format = "[$env_value]($style)"

# ── Directorio ──────────────────────────────────────────────────
# truncate_to_repo = false: dentro de un repo, starship por defecto muestra
# sólo la ruta relativa a la raíz del repo. Con dos líneas hay ancho de
# sobra, así que se prefiere la ruta real — es la que sirve para copiar o
# para entender un error.
[directory]
style = "fg:#c8b898 bold"
format = "  [$path]($style)[$read_only]($read_only_style)"
read_only_style = "fg:#b85c50"
truncate_to_repo = false
home_symbol = "󱂵 ホーム"
read_only = " 󰌾 読取専用"
truncation_length = 4
truncation_symbol = "…/"

[directory.substitutions]
"Desktop"   = "󰇄 デスクトップ"
"Documents" = "󰈙 ドキュメント"
"Downloads" = "󰇚 ダウンロード"
"Music"     = "󰎈 音楽"
"Pictures"  = "󰏏 写真"
"Videos"    = "󰕧 ビデオ"
"Projects"  = "󱌢 プロジェクト"
"GitHub"    = "󰊤 ギットハブ"
"Code"      = "󰨞 コード"
".config"   = "󰒓 設定"

# ── Git branch ──────────────────────────────────────────────────
[git_branch]
symbol = "󰊢"
style = "fg:#d8d8d8 bold"
truncation_length = 18
format = "  [$symbol $branch]($style)"

# ── Git status ──────────────────────────────────────────────────
# El format entero va entre paréntesis: es un grupo condicional de starship,
# que no se renderiza si TODAS las variables de adentro están vacías. Sin
# eso, el espacio literal de separación se dibujaba igual con el repo limpio
# y dejaba un espacio coloreado suelto después de la rama.
[git_status]
style = "fg:#b85c50 bold"
format = "([ $all_status$ahead_behind]($style))"
conflicted = "󰞇 "
ahead      = "⇡${count}"
behind     = "⇣${count}"
diverged   = "⇕"
untracked  = "󰋗 "
stashed    = "󰆼"
modified   = "󰏫 "
staged     = "󰐗 "
renamed    = "󰕚 "
deleted    = "󰍶 "

# ── Lenguajes ───────────────────────────────────────────────────
[python]
symbol = ""
style = "fg:#c8b898 bold"
format = "  [$symbol $version]($style)"

[nodejs]
symbol = ""
style = "fg:#b0d0d8 bold"
format = "  [$symbol $version]($style)"

[rust]
symbol = "󱘗"
style = "fg:#d8c098 bold"
format = "  [$symbol $version]($style)"

[golang]
symbol = ""
style = "fg:#9ab0a0 bold"
format = "  [$symbol $version]($style)"

# ── Extras ───────────────────────────────────────────────────────
[cmd_duration]
min_time = 2000
show_milliseconds = false
style = "fg:#8098a8 italic"
format = "  [󰔚 $duration]($style)"

[status]
disabled = false
style = "fg:#b85c50 bold"
format = "  [󰅚 $status]($style)"

# El símbolo es un "$" literal. En un format de starship el "$" abre una
# variable, así que hay que escaparlo con "\$" — y para que la barra llegue
# entera al parser, la cadena TOML tiene que ser literal (comillas simples),
# no básica. Con comillas dobles, TOML rechaza \$ como escape inválido.
[character]
success_symbol = '[\$](fg:#dee3e6 bold)'
error_symbol   = '[\$](fg:#b85c50 bold)'

[package]
disabled = true
[memory_usage]
disabled = true
[time]
disabled = true
[line_break]
disabled = false