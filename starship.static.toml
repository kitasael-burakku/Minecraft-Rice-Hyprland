"$schema" = 'https://starship.rs/config-schema.json'

format = """
$status\
$os\
${env_var.USER_PRETTY}\
${env_var.HOSTNAME_PRETTY}\
$directory\
$fill\
[](fg:#2e3238)\
$git_branch\
$git_status\
$python\
$nodejs\
$rust\
$golang\
${custom.right_cap}\
$line_break\
$cmd_duration\
$character\
"""

command_timeout = 500
add_newline = false

[fill]
symbol = " "

# ── OS ──────────────────────────────────────────────────────────
[os]
disabled = false
style = "bg:#1e2226 fg:#8ab0b8"
format = "[](fg:#1e2226)[ $symbol ]($style)"

[os.symbols]
Arch        = "󰣇"
CachyOS     = "󰣇"
Manjaro     = "󱆅"
Fedora      = "󰣛"
Ubuntu      = "󰕈"
Debian      = "󰣚"
NixOS       = "󱄅"
EndeavourOS = ""
Garuda      = "󰛓"
openSUSE    = ""
Gentoo      = "󰣨"
Alpine      = ""
Unknown     = "󰌽"

# ── Usuario ─────────────────────────────────────────────────────
# env_var y no custom: un [custom.*] lanza DOS `sh -c` por render de prompt
# (uno para `when`, otro para `command`) sólo para leer una variable que
# starship ya tiene en su propio entorno. env_var la lee en proceso, sin
# forks. Se oculta sola si USER_PRETTY no está definida — mismo
# comportamiento que daba el `when` anterior, sin el coste.
[env_var.USER_PRETTY]
style = "bg:#2e3238 fg:#b0d0d8 bold"
format = "[](bg:#2e3238 fg:#1e2226)[ $env_value ]($style)"

# ── Hostname ────────────────────────────────────────────────────
# Antes: `hostnamectl --pretty`, que no lee un archivo sino que abre D-Bus
# contra systemd-hostnamed (activando el servicio si no estaba corriendo) —
# 59 ms medidos POR PROMPT, sobre un dato que no cambia entre logins. Era el
# módulo más caro del prompt por un factor de 4.
# HOSTNAME_PRETTY sale ahora de hypr/modules/environment.lua, la misma fuente
# única donde ya viven XCURSOR_THEME y GTK_THEME.
[env_var.HOSTNAME_PRETTY]
style = "bg:#2e3238 fg:#8098a8"
format = "[ 󰍹 $env_value ]($style)"

# ── Directorio ──────────────────────────────────────────────────
[directory]
style = "bg:#2e3238 fg:#c8b898 bold"
format = "[ $path ]($style)[](fg:#2e3238 bg:none) "
home_symbol = "󱂵 ホーム"
read_only = " 󰌾 読取専用"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Desktop"   = "󰇄 デスクトップ"
"Documents" = "󰈙 ドキュメント"
"Downloads" = "󰇚 ダウンロード"
"Music"     = "󰎈 音楽"
"Pictures"  = "󰏏 写真"
"Videos"    = "󰕧 ビデオ"
"Projects"  = "󱌢 プロジェクト"
"GitHub"    = "󰊤 ギットハブ"
"Code"      = "󰨞 コード"
".config"   = "󰒓 設定"

# ── Git branch ──────────────────────────────────────────────────
[git_branch]
symbol = "󰊢"
style = "bg:#2e3238 fg:#d8d8d8 bold"
truncation_length = 18
format = "[ $symbol $branch ]($style)"

# ── Git status ──────────────────────────────────────────────────
[git_status]
style = "bg:#2e3238 fg:#b85c50 bold"
format = "[$all_status$ahead_behind ]($style)"
conflicted = "󰞇 "
ahead      = "⇡${count}"
behind     = "⇣${count}"
diverged   = "⇕"
untracked  = "󰋗 "
stashed    = "󰆼"
modified   = "󰏫 "
staged     = "󰐗 "
renamed    = "󰕚 "
deleted    = "󰍶 "

# ── Lenguajes ───────────────────────────────────────────────────
[python]
symbol = ""
style = "bg:#2e3238 fg:#c8b898 bold"
format = "[$symbol $version ]($style)"

[nodejs]
symbol = ""
style = "bg:#2e3238 fg:#b0d0d8 bold"
format = "[$symbol $version ]($style)"

[rust]
symbol = "󱘗"
style = "bg:#2e3238 fg:#d8c098 bold"
format = "[$symbol $version ]($style)"

[golang]
symbol = ""
style = "bg:#2e3238 fg:#9ab0a0 bold"
format = "[$symbol $version ]($style)"

# ── Cierre bloque derecho ────────────────────────────────────────
[custom.right_cap]
command = "echo"
when = "true"
format = "[](fg:#2e3238 bg:none)"

# ── Extras ───────────────────────────────────────────────────────
[cmd_duration]
min_time = 2000
show_milliseconds = false
style = "fg:#ffffff italic"
format = "[ 󰔚 $duration ]($style)"

[character]
success_symbol = "[ ● ](fg:#ffffff bold)"
error_symbol   = "[ ● ](fg:#b85c50 bold)"

[status]
disabled = false
style = "fg:#b85c50 bold"
format = "[󰅚 $status ]($style)"

[package]
disabled = true
[memory_usage]
disabled = true
[time]
disabled = true
[line_break]
disabled = false