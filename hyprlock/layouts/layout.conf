# =====================================================
# HYPRLOCK — Minecraft Linux Glass Lock
# =====================================================

# BACKGROUND
background {
    monitor =
    # current.png se regenera cada vez que se elige un wallpaper (ver
    # hypr/scripts/apply-wallpaper.sh) — hyprlock hereda el mismo fondo que
    # el escritorio. 2.png es el fallback estático versionado, usado por
    # apply-static-colors.sh para poblar current.png en un clon nuevo.
    path = ~/.config/hyprlock/wallpapers/current.png

    blur_passes = 2
    blur_size = 3

    contrast = 1.0
    brightness = 0.42
    vibrancy = 0.16
    vibrancy_darkness = 0.10

    zindex = -1
}

# Animations
animations {
    enabled = true

    bezier = cinematic,  0.00, 0.00, 0.15, 1.00
    bezier = lockSmooth, 0.16, 1.00, 0.30, 1.00
    bezier = fadeSoft,   0.37, 0.00, 0.63, 1.00

    animation = fadeIn,  1, 6, cinematic
    animation = fadeOut, 1, 3, fadeSoft

    animation = inputFieldDots,   1, 3.0, lockSmooth
    animation = inputFieldColors, 1, 2.4, lockSmooth
    animation = inputFieldFade,   1, 2.0, fadeSoft
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
    hide_cursor = true

    ignore_empty_input = true

    immediate_render = true

    text_trim = true

    fractional_scaling = 2

    fail_timeout = 1800
}

# -----------------------------------------------------
# TOP LEFT — SYSTEM TAG
# -----------------------------------------------------

label {
    monitor =
    text = <span foreground="$textPrimary"> CachyOS</span> <span foreground="$textMuted">/</span> <span foreground="$goldSpan">Arch Linux</span>

    color = $textBody

    font_size = 18
    font_family = JetBrainsMono Nerd Font

    position = 42, -38
    halign = left
    valign = top

    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.65)
    shadow_boost = 1.3

    zindex = 2
}

# -----------------------------------------------------
# TOP RIGHT — PLAYER CARD
# -----------------------------------------------------
# Antes la fuente y el título flotaban sueltos y solo la fila de la barra
# tenía una píldora detrás. Ahora es una sola tarjeta de vidrio que encierra
# las 3 filas (fuente/estado, título—artista, barra+tiempo), todas
# alimentadas por hyprlock/scripts/player.sh (fusiona lo que antes eran
# music-progress.sh + playerlayout4.sh — ver ese script para el detalle del
# bug de unidades que arregla).

shape {
    monitor =
    size = 280, 45

    color = $surfaceCard

    rounding = 99

    border_size = 1
    border_color = $accentBorder

    shadow_passes = 3
    shadow_size = 10
    shadow_color = rgba(0,0,0,0.70)
    shadow_boost = 1.3

    position = -24, -60
    halign = right
    valign = top

    zindex = 1
}


# TÍTULO — ARTISTA
label {
    monitor =
    text = cmd[update:1000] ~/.config/hyprlock/scripts/player.sh --title

    color = $textPrimary

    font_size = 12
    font_family = JetBrainsMono Nerd Font

    position = -44, -32
    halign = right
    valign = top

    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.65)

    zindex = 2
}

# BARRA DE PROGRESO + TIEMPO
label {
    monitor =
    text = cmd[update:1000] ~/.config/hyprlock/scripts/player.sh --bar

    color = $textBody

    font_size = 10
    font_family = JetBrainsMono Nerd Font

    position = -40, -74
    halign = right
    valign = top

    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.65)

    zindex = 2
}

# -----------------------------------------------------
# CENTER TIME
# -----------------------------------------------------

shape {
    monitor =
    size = 500, 280

    color = $surfaceCard

    rounding = 50

    border_size = 1
    border_color = $accentBorder

    shadow_passes = 3
    shadow_size = 10
    shadow_color = rgba(0, 0, 0, 0.9)
    shadow_boost = 1.3

    position = 0, 10
    halign = center
    valign = center

    zindex = 1
}

label {
    monitor =
    text = $TIME

    color = $textPrimary

    font_size = 108
    font_family = JetBrainsMono Nerd Font

    position = 0, 54
    halign = center
    valign = center

    shadow_passes = 3
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 0.72)
    shadow_boost = 1.35

    zindex = 2
}

# DATE
label {
    monitor =
    text = cmd[update:43200000] echo "$(date +"%A, %d de %B")"

    color = $textDim

    font_size = 20
    font_family = JetBrainsMono Nerd Font Bold

    position = 0, -45
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.70)

    zindex = 2
}

# SMALL WORLD STATUS
label {
    monitor =
    text =<span foreground="$textMuted">I hope you are enjoying it</span>

    font_size = 13
    font_family = JetBrainsMono Nerd Font

    position = 0, -90
    halign = center
    valign = center

    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.70)

    zindex = 2
}

# -----------------------------------------------------
# BOTTOM AUTH GLASS CARD
# -----------------------------------------------------
# Antes eran dos cajas separadas (usuario y input) con 70px de por medio y
# el orden invertido (el input quedaba arriba del nombre de usuario). Ahora
# es una sola tarjeta con el usuario arriba y el campo de contraseña debajo,
# en orden de lectura normal; el estado de fallo/PAM queda fuera de la
# tarjeta, discreto, debajo — solo se nota cuando hay algo que decir.

shape {
    monitor =
    size = 372, 112

    color = $surfaceCard

    rounding = 20
    border_size = 1
    border_color = $accentBorder

    position = 0, -460
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.55)
    shadow_boost = 1.10

    zindex = 1
}

# USERNAME
label {
    monitor =
    text =   $USER

    color = $textPrimary

    font_size = 15
    font_family = JetBrainsMono Nerd Font

    position = 0, -430
    halign = center
    valign = center

    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.65)

    zindex = 2
}

# PASSWORD INPUT
input-field {
    monitor =
    size = 340, 52

    outline_thickness = 2

    dots_size = 0.30
    dots_spacing = 0.35
    dots_center = true

    rounding = -1

    outer_color = $accentOuter
    inner_color = $surfaceDeep
    font_color = $goldSoft
    font_family = JetBrainsMono Nerd Font

    fade_on_empty = false

    placeholder_text = <span foreground="$textMuted">Insert Your Password</span>
    hide_input = false

    check_color = $accentCheck
    check_text = <span foreground="$accentSpan">Validating...</span>

    fail_color = $failColor
    fail_text = <span foreground="$failSpan">Access Denied</span> <span foreground="$textMuted">($ATTEMPTS)</span>

    capslock_color = $accentCaps
    numlock_color = $goldNum
    bothlock_color = $bothlockColor

    swap_font_color = false

    position = 0, -480
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.35)
    shadow_boost = 1.10

    zindex = 2
}

# FAILED ATTEMPTS / PAM STATUS
label {
    monitor =
    text = $PAMFAIL

    color = $failColor

    font_size = 12
    font_family = JetBrainsMono Nerd Font

    position = 0, -380
    halign = center
    valign = center

    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.70)

    zindex = 2
}

# -----------------------------------------------------
# BOTTOM RIGHT TINY HINT
# -----------------------------------------------------

label {
    monitor =
    text = <span foreground="$textMuted">ESC</span> clear  <span foreground="$textMuted">Ctrl+U</span> reset

    color = $textDim

    font_size = 12
    font_family = JetBrainsMono Nerd Font

    position = -38, 34
    halign = right
    valign = bottom

    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.65)

    zindex = 2
}
