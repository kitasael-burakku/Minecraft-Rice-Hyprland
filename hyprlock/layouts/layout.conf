# =====================================================
# HYPRLOCK — Minecraft Linux Glass Lock
# =====================================================

# BACKGROUND
background {
    monitor =
    # current.png se regenera cada vez que se elige un wallpaper (ver
    # hypr/scripts/apply-wallpaper.sh) — hyprlock hereda el mismo fondo que
    # el escritorio. 2.png es el fallback estático versionado, usado por
    # apply-static-colors.sh para poblar current.png en un clon nuevo.
    path = ~/.config/hyprlock/wallpapers/current.png

    blur_passes = 1
    blur_size = 1

    contrast = 1.0
    brightness = 0.42
    vibrancy = 0.16
    vibrancy_darkness = 0.10

    zindex = -1
}

# Animations
animations {
    enabled = true

    bezier = cinematic,  0.00, 0.00, 0.15, 1.00
    bezier = lockSmooth, 0.16, 1.00, 0.30, 1.00
    bezier = fadeSoft,   0.37, 0.00, 0.63, 1.00

    animation = fadeIn,  1, 6, cinematic
    animation = fadeOut, 1, 3, fadeSoft

    animation = inputFieldDots,   1, 3.0, lockSmooth
    animation = inputFieldColors, 1, 2.4, lockSmooth
    animation = inputFieldFade,   1, 2.0, fadeSoft
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
    hide_cursor = true

    ignore_empty_input = true

    immediate_render = true

    text_trim = true

    fractional_scaling = 2

    fail_timeout = 1800
}

# -----------------------------------------------------
# TOP LEFT — SYSTEM TAG
# -----------------------------------------------------

label {
    monitor =
    text = <span foreground="##f5f5f5"> CachyOS</span> <span foreground="##8a8a8a">/</span> <span foreground="$goldSpan">Arch Linux</span>

    color = rgba(209, 209, 209, 0.88)

    font_size = 18
    font_family = JetBrainsMono Nerd Font

    position = 42, -38
    halign = left
    valign = top

    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.65)
    shadow_boost = 1.3

    zindex = 2
}

#------------------------------------------------------
# Player Pill
# -----------------------------------------------------

shape {
    monitor =

    size = 215, 25

    color = rgba(18,18,18,0.45)

    rounding = -1

    border_size = 1
    border_color = $accentBorder

    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(0,0,0,0.70)
    shadow_boost = 1.3

    position = -30, -78
    halign = right
    valign = top

    zindex = 1
}

# -----------------------------------------------------
# TOP RIGHT — PLAYER 
# -----------------------------------------------------

# SOURCE
label {
    monitor =
    text = cmd[update:3000] ~/.config/hyprlock/scripts/playerlayout4.sh --source

    color = $goldSoft

    font_size = 14
    font_family = JetBrainsMono Nerd Font

    position = -42, -26
    halign = right
    valign = top

    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.65)

    zindex = 2
}

# TITLE — ARTIST
label {
    monitor =
    text = cmd[update:3000] echo "$(~/.config/hyprlock/scripts/playerlayout4.sh --title) — $(~/.config/hyprlock/scripts/playerlayout4.sh --artist)"

    color = rgba(245, 245, 245, 0.90)

    font_size = 12
    font_family = JetBrainsMono Nerd Font

    position = -42, -50
    halign = right
    valign = top

    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.65)

    zindex = 2
}

# PROGRESS BAR
label {
    monitor =
    text = cmd[update:1000] ~/.config/hyprlock/scripts/music-progress.sh

    color = $accentSpan

    font_size = 10
    font_family = JetBrainsMono Nerd Font

    position = -42, -80
    halign = right
    valign = top

    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.65)

    zindex = 2
}

# -----------------------------------------------------
# CENTER TIME
# -----------------------------------------------------

label {
    monitor =
    text = $TIME

    color = rgba(255, 255, 255, 1.0)

    font_size = 108
    font_family = JetBrainsMono Nerd Font

    position = 0, 54
    halign = center
    valign = center

    shadow_passes = 3
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 0.72)
    shadow_boost = 1.35

    zindex = 2
}

# DATE
label {
    monitor =
    text = cmd[update:43200000] echo "$(date +"%A, %d de %B")"

    color = rgba(245, 245, 245, 0.46)

    font_size = 20
    font_family = JetBrainsMono Nerd Font Bold

    position = 0, -30
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.70)

    zindex = 2
}

# SMALL WORLD STATUS
label {
    monitor =
    text =<span foreground="##f5f5f5">I hope you are enjoying it</span>

    font_size = 13
    font_family = DepartureMono Nerd Font Mono

    position = 0, -70
    halign = center
    valign = center

    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.70)

    zindex = 2
}

# -----------------------------------------------------
# BOTTOM AUTH GLASS PILL
# -----------------------------------------------------

# USER BOX
shape {
    monitor =
    size = 360, 52

    color = rgba(26, 26, 26, 0.42)

    rounding = -1
    border_size = 1
    border_color = $accentBorder

    position = 0, -300
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.55)
    shadow_boost = 1.10

    zindex = 1
}

# USERNAME
label {
    monitor =
    text =   $USER

    color = rgba(245, 245, 245, 0.86)

    font_size = 15
    font_family = JetBrainsMono Nerd Font

    position = 0, -300
    halign = center
    valign = center

    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.65)

    zindex = 2
}

# PASSWORD INPUT
input-field {
    monitor =
    size = 360, 52

    outline_thickness = 2

    dots_size = 0.30
    dots_spacing = 0.35
    dots_center = true

    rounding = -1

    outer_color = $accentOuter
    inner_color = rgba(5, 5, 5, 0.36)
    font_color = rgba(255, 255, 255, 0.92)
    font_family = JetBrainsMono Nerd Font

    fade_on_empty = true
    fade_timeout = 1200

    placeholder_text = <span foreground="##8a8a8a">Password</span>
    hide_input = false

    check_color = $accentCheck
    check_text = <span foreground="$accentSpan">checking...</span>

    fail_color = $failColor
    fail_text = <span foreground="$failSpan">access denied</span> <span foreground="##8a8a8a">($ATTEMPTS)</span>

    capslock_color = $accentCaps
    numlock_color = $goldNum
    bothlock_color = $bothlockColor

    swap_font_color = false

    position = 0, -370
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.55)
    shadow_boost = 1.10

    zindex = 2
}

# FAILED ATTEMPTS / PAM STATUS
label {
    monitor =
    text = $PAMFAIL

    color = $pamfailColor

    font_size = 12
    font_family = DepartureMono Nerd Font Mono

    position = 0, -430
    halign = center
    valign = center

    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.70)

    zindex = 2
}

# -----------------------------------------------------
# BOTTOM RIGHT TINY HINT
# -----------------------------------------------------

label {
    monitor =
    text = <span foreground="##8a8a8a">ESC</span> clear  <span foreground="##8a8a8a">Ctrl+U</span> reset

    color = rgba(209, 209, 209, 0.46)

    font_size = 12
    font_family = JetBrainsMono Nerd Font

    position = -38, 34
    halign = right
    valign = bottom

    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.65)

    zindex = 2
}
