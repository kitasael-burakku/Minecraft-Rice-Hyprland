# ~/.config/matugen/config.toml
# Kitasan Glass — theming dinámico por wallpaper. Todo sigue al wallpaper
# (fondos, acentos, bordes, starship, fish) salvo los colores semánticos
# (error/crítico) que quedan fijos a propósito.
#
# Invocado como: matugen image <frame-o-imagen> -m dark -t scheme-tonal-spot
# vía ~/.config/rofi/scripts/matugen_reload.sh (gateado por el sentinel
# ~/.config/matugen/enabled — apagado por defecto).
#
# A propósito NO hay [config.wallpaper]: el wallpaper lo siguen manejando
# awww/mpvpaper/wallpaper_grid.sh, matugen solo genera colores.

# prefer = "saturation" evita el prompt interactivo de matugen cuando una
# imagen tiene varios colores candidatos igual de dominantes — necesario
# porque esto se invoca desde un script en background, sin terminal.
[config]
prefer = "saturation"

[templates.rofi]
input_path  = '~/.config/matugen/templates/rofi-colors.rasi'
output_path = '~/.config/rofi/colors.rasi'
# sin post_hook: rofi se relanza por invocación, recoge colores solo

[templates.waybar]
input_path  = '~/.config/matugen/templates/waybar-colors.css'
output_path = '~/.config/waybar/colors.css'
post_hook   = 'pkill -SIGUSR2 waybar || true'

[templates.kitty]
input_path  = '~/.config/matugen/templates/kitty-colors.conf'
output_path = '~/.config/kitty/colors/colors.conf'
post_hook   = 'killall -SIGUSR1 kitty 2>/dev/null || true'

[templates.wlogout]
input_path  = '~/.config/matugen/templates/wlogout-colors.css'
output_path = '~/.config/wlogout/colors.css'
# sin post_hook: wlogout se relanza por invocación

[templates.hyprlock]
input_path  = '~/.config/matugen/templates/hyprlock-colors.conf'
output_path = '~/.config/hyprlock/colors.conf'
# sin post_hook: hyprlock se relanza por invocación (cada bloqueo es un proceso nuevo)

[templates.hypr_live]
input_path  = '~/.config/matugen/templates/hypr-colors.sh'
output_path = '~/.config/hypr/dynamic-colors.sh'
post_hook   = 'bash ~/.config/hypr/dynamic-colors.sh'

[templates.swaync]
input_path  = '~/.config/matugen/templates/swaync-colors.css'
output_path = '~/.config/swaync/colors.css'
post_hook   = 'swaync-client -rs >/dev/null 2>&1 || true'

[templates.starship]
input_path  = '~/.config/matugen/templates/starship.toml'
output_path = '~/.config/starship.toml'
# sin post_hook: starship relee su config en cada render de prompt, solo

[templates.fish]
input_path  = '~/.config/matugen/templates/theme-goldship.fish'
output_path = '~/.config/fish/conf.d/theme-goldship.fish'
# sin post_hook posible: fish solo lee conf.d/ al arrancar la shell, no hay
# señal de reload en caliente — las terminales nuevas ya lo recogen solas

[templates.music_progress]
input_path  = '~/.config/matugen/templates/music-progress-colors.sh'
output_path = '~/.config/hyprlock/scripts/music-colors.sh'
# sin post_hook: music-progress.sh relee este archivo en cada invocación
# (cada 1s), no hace falta ninguna señal

[templates.gtk3]
input_path  = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-3.0/colors.css'
# sin post_hook: GTK no tiene señal de recarga en caliente — las ventanas
# nuevas lo recogen solas (mismo criterio que [templates.fish])

[templates.gtk4]
input_path  = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-4.0/colors.css'
# sin post_hook, misma razón que gtk3
