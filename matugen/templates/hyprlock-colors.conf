# Kitasan Glass — acentos dinámicos de Hyprlock. Generado por matugen.
# Estático de referencia: ~/.config/hyprlock/colors.static.conf
$goldSpan     = ##{{colors.tertiary.default.hex_stripped}}
$accentSpan   = ##{{colors.primary.default.hex_stripped}}
$goldSoft     = rgba({{colors.tertiary.default.hex_stripped}}a6)
$goldNum      = rgba({{colors.tertiary.default.hex_stripped}}b3)
$accentBorder = rgba({{colors.primary.default.hex_stripped}}3d)
$accentOuter  = rgba({{colors.primary.default.hex_stripped}}2e)
$accentCheck  = rgba({{colors.primary.default.hex_stripped}}80)
$accentCaps   = rgba({{colors.primary.default.hex_stripped}}e6)
$failSpan      = ##{{colors.error.default.hex_stripped}}
$failColor     = rgba({{colors.error.default.hex_stripped}}db)
$bothlockColor = rgba({{colors.error.default.hex_stripped}}bd)
$pamfailColor  = rgba({{colors.error.default.hex_stripped}}b8)

# Texto/superficie — mismos roles que ya usan rofi/waybar/swaync, para que
# el lockscreen deje de ser la única app del rice con texto fijo (blanco/gris
# hardcodeado en layout.conf) en vez de seguir al wallpaper.
$textPrimary  = ##{{colors.on_surface.default.hex_stripped}}
$textBody     = rgba({{colors.on_surface_variant.default.hex_stripped}}e6)
$textDim      = rgba({{colors.on_surface_variant.default.hex_stripped}}75)
$textMuted    = ##{{colors.outline.default.hex_stripped}}
$surfaceCard  = rgba({{colors.surface_container.default.hex_stripped}}6b)
$surfaceDeep  = rgba({{colors.surface_container_lowest.default.hex_stripped}}5c)
