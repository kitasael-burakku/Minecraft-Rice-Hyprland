[ColorScheme]
# Kitasan Glass — paleta Qt (qt5ct/qt6ct) generada por matugen.
# Estático de referencia: ~/.config/qt5ct/colors/kitasan-glass.static.conf
#
# Diff mínimo sobre /usr/share/qt5ct/colors/darker.conf (el palette que ya
# usaba este sistema — color_scheme_path apuntaba ahí): sólo se sustituyen
# los roles QPalette que mapean con confianza a la paleta de matugen —
# WindowText/Text/ButtonText (fg), Base/Window (fondos), Highlight/
# HighlightedText (selección/acento), AlternateBase. El resto (Button,
# Light, Midlight, Dark, Mid, BrightText, Shadow, Link, LinkVisited,
# ToolTipBase/Text, PlaceholderText, el último valor semitransparente) se
# deja EXACTAMENTE como en darker.conf — no hay forma de derivarlos con
# confianza desde el rol de matugen equivalente, y total de las 21
# posiciones de cada línea es más superficie de la que hace falta re-tintar
# a ciegas (mismo criterio que gtk-colors.css con las variables "_breeze").
#
# disabled_colors reusa los mismos 4 tonos de gris plano que ya traía
# darker.conf para WindowText/Text/ButtonText/HighlightedText — es el
# estado "apagado", no debería seguir el acento.
# inactive_colors es igual a active_colors, mismo patrón que darker.conf.

active_colors=#ff{{colors.on_surface.default.hex_stripped}}, #ff424245, #ff979797, #ff5e5c5b, #ff302f2e, #ff4a4947, #ff{{colors.on_surface.default.hex_stripped}}, #ffffffff, #ff{{colors.on_surface.default.hex_stripped}}, #ff{{colors.surface_container_low.default.hex_stripped}}, #ff{{colors.surface.default.hex_stripped}}, #ff222020, #ff{{colors.primary.default.hex_stripped}}, #ff{{colors.on_primary.default.hex_stripped}}, #ff0986d3, #ffa70b06, #ff{{colors.surface_container.default.hex_stripped}}, #ffffffff, #ff3f3f36, #ffffffff, #80ffffff
disabled_colors=#ff808080, #ff424245, #ff979797, #ff5e5c5b, #ff302f2e, #ff4a4947, #ff808080, #ffffffff, #ff808080, #ff{{colors.surface_container_low.default.hex_stripped}}, #ff{{colors.surface.default.hex_stripped}}, #ff222020, #ff{{colors.primary.default.hex_stripped}}, #ff808080, #ff0986d3, #ffa70b06, #ff{{colors.surface_container.default.hex_stripped}}, #ffffffff, #ff3f3f36, #ffffffff, #80ffffff
inactive_colors=#ff{{colors.on_surface.default.hex_stripped}}, #ff424245, #ff979797, #ff5e5c5b, #ff302f2e, #ff4a4947, #ff{{colors.on_surface.default.hex_stripped}}, #ffffffff, #ff{{colors.on_surface.default.hex_stripped}}, #ff{{colors.surface_container_low.default.hex_stripped}}, #ff{{colors.surface.default.hex_stripped}}, #ff222020, #ff{{colors.primary.default.hex_stripped}}, #ff{{colors.on_primary.default.hex_stripped}}, #ff0986d3, #ffa70b06, #ff{{colors.surface_container.default.hex_stripped}}, #ffffffff, #ff3f3f36, #ffffffff, #80ffffff
